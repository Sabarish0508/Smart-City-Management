server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# MySQL Database Configuration (Environment variable support)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_civic_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart / File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# Custom File Upload Storage Directory
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# JWT Security Configuration (Environment variable support)
app.jwt.secret=${JWT_SECRET:9a6747f3c12f4ef7a8b3d68c928e45b12a884f6b2e3c1d9a8e7f6d5c4b3a210f9a6747f3c12f4ef7a8b3d68c928e45b12a884f6b2e3c1d9a8e7f6d5c4b3a210f}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175
